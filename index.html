<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>社労士 問題演習</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .app-logo {
      font-size: 28px;
      text-align: center;
      margin: 28px 0 4px;
    }
    .app-tagline {
      text-align: center;
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 8px;
    }
    .coming-soon-card {
      background: var(--gray-200);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      opacity: 0.6;
    }
    .coming-soon-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-500);
      margin-bottom: 4px;
    }
    .coming-soon-badge {
      display: inline-block;
      background: var(--gray-300);
      color: var(--gray-500);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .reset-btn {
      background: none;
      border: none;
      color: var(--gray-500);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📚 社労士 問題演習</h1>
  <span class="header-badge">β版</span>
</div>

<div class="page">
  <div class="app-logo">🎯</div>
  <p class="app-tagline">スキマ時間に一問一答で実力アップ</p>

  <div class="section-title">学習中の科目</div>

  <!-- 国民健康保険法カード -->
  <div class="subject-card">
    <div class="subject-card-header">
      <div style="display:flex; justify-content:space-between; align-items:start">
        <div>
          <div class="subject-card-title">国民健康保険法</div>
          <div class="subject-card-meta">全100問（1回30問）・ 一般常識</div>
        </div>
        <button class="reset-btn" onclick="handleReset('kokumin_kenko_hoken', this)">リセット</button>
      </div>
    </div>
    <div class="subject-card-stats">
      <div class="stat-item">
        <div class="stat-value" id="kokumin-attempts">—</div>
        <div class="stat-label">累計回答</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="kokumin-accuracy">—</div>
        <div class="stat-label">正解率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:var(--danger)" id="kokumin-weak">—</div>
        <div class="stat-label">苦手問題</div>
      </div>
    </div>
    <div class="subject-card-actions">
      <button class="btn btn-primary" onclick="openModal('kokumin_kenko_hoken')">
        <span class="btn-icon">▶</span> 演習開始
      </button>
    </div>
  </div>

  <!-- 健康保険法カード（①〜④統合） -->
  <div class="subject-card">
    <div class="subject-card-header">
      <div style="display:flex; justify-content:space-between; align-items:start">
        <div>
          <div class="subject-card-title">健康保険法</div>
          <div class="subject-card-meta">全565問（①〜④からランダム30問）・ 社会保険</div>
        </div>
        <button class="reset-btn" onclick="handleReset('kenkou_hoken', this)">リセット</button>
      </div>
    </div>
    <div class="subject-card-stats">
      <div class="stat-item">
        <div class="stat-value" id="kenkou-attempts">—</div>
        <div class="stat-label">累計回答</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="kenkou-accuracy">—</div>
        <div class="stat-label">正解率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:var(--danger)" id="kenkou-weak">—</div>
        <div class="stat-label">苦手問題</div>
      </div>
    </div>
    <div class="subject-card-actions">
      <button class="btn btn-primary" onclick="openModal('kenkou_hoken')">
        <span class="btn-icon">▶</span> 演習開始
      </button>
    </div>
  </div>

  <!-- 厚生年金保険法カード -->
  <div class="subject-card">
    <div class="subject-card-header">
      <div style="display:flex; justify-content:space-between; align-items:start">
        <div>
          <div class="subject-card-title">厚生年金保険法</div>
          <div class="subject-card-meta">全139問（①②からランダム30問）・ 社会保険</div>
        </div>
        <button class="reset-btn" onclick="handleReset('kousei_nenkin', this)">リセット</button>
      </div>
    </div>
    <div class="subject-card-stats">
      <div class="stat-item">
        <div class="stat-value" id="nenkin-attempts">—</div>
        <div class="stat-label">累計回答</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="nenkin-accuracy">—</div>
        <div class="stat-label">正解率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:var(--danger)" id="nenkin-weak">—</div>
        <div class="stat-label">苦手問題</div>
      </div>
    </div>
    <div class="subject-card-actions">
      <button class="btn btn-primary" onclick="openModal('kousei_nenkin')">
        <span class="btn-icon">▶</span> 演習開始
      </button>
    </div>
  </div>

  <div class="section-title">追加予定の科目</div>

  <div class="coming-soon-card">
    <div class="coming-soon-title">国民年金法</div>
    <span class="coming-soon-badge">準備中</span>
  </div>
  <div class="coming-soon-card">
    <div class="coming-soon-title">雇用保険法</div>
    <span class="coming-soon-badge">準備中</span>
  </div>
  <div class="coming-soon-card">
    <div class="coming-soon-title">労働基準法</div>
    <span class="coming-soon-badge">準備中</span>
  </div>
</div>

<!-- モード選択シート -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">演習モードを選択</div>
    <div class="modal-subtitle" id="modal-subject-name"></div>
    <div class="mode-options">
      <div class="mode-option selected" id="mode-all" onclick="selectMode('all')">
        <div class="mode-icon">📋</div>
        <div class="mode-info">
          <div class="mode-name">全問演習</div>
          <div class="mode-desc" id="modal-all-desc">全問からランダムに30問を出題</div>
        </div>
      </div>
      <div class="mode-option" id="mode-weak" onclick="selectMode('weak')">
        <div class="mode-icon">🎯</div>
        <div class="mode-info">
          <div class="mode-name">苦手問題のみ</div>
          <div class="mode-desc" id="modal-weak-desc">1度でも間違えた問題を集中演習</div>
        </div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" style="width:100%; font-size:16px; padding:16px;" onclick="startQuiz()">
        この設定で開始 ▶
      </button>
    </div>
  </div>
</div>

<script src="js/quiz.js"></script>
<script>
  const SUBJECTS = [
    { key: 'kokumin_kenko_hoken', file: 'kokumin_kenko_hoken', prefix: 'kokumin' },
    { key: 'kenkou_hoken',        file: 'kenkou_hoken',        prefix: 'kenkou'  },
    { key: 'kousei_nenkin',       file: 'kousei_nenkin',       prefix: 'nenkin'  },
  ];

  let selectedMode = 'all';
  let currentSubject = '';

  async function init() {
    for (const s of SUBJECTS) {
      const stats = QuizAPI.getStats(s.key);
      const attempts = stats.totalAttempts;
      const accuracy = attempts > 0
        ? Math.round((stats.totalCorrect / attempts) * 100) + '%'
        : '—';
      document.getElementById(`${s.prefix}-attempts`).textContent = attempts || '—';
      document.getElementById(`${s.prefix}-accuracy`).textContent = accuracy;
      document.getElementById(`${s.prefix}-weak`).textContent = stats.weakCount || '—';
    }
  }

  const ALL_MODE_DESC = {
    kokumin_kenko_hoken: '全100問からランダムに30問を出題',
    kenkou_hoken:        '全565問（①〜④）からランダムに30問を出題',
    kousei_nenkin:       '全139問（①②）からランダムに30問を出題',
  };

  function openModal(subject) {
    currentSubject = subject;
    selectedMode = 'all';
    document.getElementById('mode-all').classList.add('selected');
    document.getElementById('mode-weak').classList.remove('selected');

    document.getElementById('modal-all-desc').textContent =
      ALL_MODE_DESC[subject] || '全問からランダムに30問を出題';

    const weakIds = QuizAPI.getWeakQuestionIds(subject);
    const weakDesc = weakIds.length > 0
      ? `現在 ${weakIds.length}問の苦手問題があります`
      : '苦手問題がまだありません（全問演習後に追加されます）';
    document.getElementById('modal-weak-desc').textContent = weakDesc;

    const weakEl = document.getElementById('mode-weak');
    weakEl.style.opacity = weakIds.length === 0 ? '0.5' : '1';
    weakEl.style.pointerEvents = weakIds.length === 0 ? 'none' : 'auto';

    document.getElementById('modal').classList.add('show');
  }

  function closeModalOutside(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function selectMode(mode) {
    selectedMode = mode;
    document.getElementById('mode-all').classList.toggle('selected', mode === 'all');
    document.getElementById('mode-weak').classList.toggle('selected', mode === 'weak');
  }

  function startQuiz() {
    location.href = `quiz.html?subject=${currentSubject}&mode=${selectedMode}`;
  }

  async function handleReset(subject) {
    if (!confirm('この科目の学習記録をすべてリセットしますか？')) return;
    QuizAPI.resetSubject(subject);
    await init();
  }

  init();
</script>
</body>
</html>
