<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>問題追加 - 社労士</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .upload-page { max-width: 600px; margin: 0 auto; padding: 16px; }
    .upload-section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .upload-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #1e293b; }
    .file-input-wrap { position: relative; }
    .file-input-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 40px 16px; border: 2px dashed #cbd5e1;
      border-radius: 12px; background: #f8fafc; cursor: pointer;
      font-size: 15px; color: #64748b; font-weight: 600;
    }
    .file-input-btn:active { background: #e2e8f0; }
    #file-input-q, #file-input-a, #file-input-pdf { display: none; }
    .preview-img { width: 100%; border-radius: 8px; margin-top: 12px; max-height: 400px; object-fit: contain; }
    .form-row { margin-bottom: 12px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-select, .form-input {
      width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0;
      border-radius: 8px; font-size: 14px; color: #1e293b;
    }
    .btn-extract {
      width: 100%; padding: 14px; background: #4f46e5; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-extract:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-commit {
      width: 100%; padding: 14px; background: #16a34a; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 12px;
    }
    .btn-commit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back { background: none; border: none; color: #64748b; font-size: 22px; cursor: pointer; }
    .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .q-card { background: #f8fafc; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
    .q-id { font-weight: 700; color: #4f46e5; margin-bottom: 4px; }
    .q-text { margin-bottom: 6px; line-height: 1.5; }
    .q-answer { font-weight: 600; color: #16a34a; }
    .q-answer.wrong { color: #dc2626; }
    .q-exp { color: #475569; margin-top: 6px; font-size: 12px; line-height: 1.5; }
    .status-box { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 8px; text-align: center; }
    .status-box.success { background: #dcfce7; color: #166534; }
    .status-box.error   { background: #fee2e2; color: #991b1b; }
    .status-box.loading { background: #ede9fe; color: #4338ca; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .badge-count { background: #e0e7ff; color: #4338ca; }

    /* モード切替タブ */
    .mode-tabs { display: flex; gap: 8px; }
    .mode-tab {
      flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px;
      background: #f8fafc; font-size: 14px; font-weight: 600; color: #64748b;
      cursor: pointer;
    }
    .mode-tab.active {
      border-color: #4f46e5; background: #ede9fe; color: #4f46e5;
    }

    /* バッチ進捗 */
    .batch-progress-bar-wrap {
      margin-top: 8px; height: 6px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
    }
    .batch-progress-bar { height: 100%; background: #4f46e5; border-radius: 4px; transition: width .3s; }
    .batch-log { margin-top: 8px; max-height: 120px; overflow-y: auto;
      font-size: 12px; color: #475569; line-height: 1.6; }
    .batch-log-item.ok   { color: #166534; }
    .batch-log-item.err  { color: #991b1b; }
    .batch-log-item.info { color: #4338ca; }

    .btn-cancel {
      width: 100%; padding: 12px; background: #dc2626; color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 10px;
    }
    .btn-cancel:active { background: #b91c1c; }

    .review-error-card {
      background: #fee2e2; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; font-size: 12px; color: #991b1b;
    }
    .review-error-card strong { display: block; margin-bottom: 4px; }

    /* サブカテゴリ収録状況 */
    .subcat-info-box {
      margin-top: 8px; padding: 10px 12px; background: #f0fdf4;
      border-radius: 8px; font-size: 12px; line-height: 1.7; min-height: 32px;
      border: 1px solid #bbf7d0;
    }
    .subcat-info-box.loading { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }
    .subcat-info-box.has-missing { background: #fefce8; border-color: #fde047; }

    /* ペア選択カード */
    .pair-select-card {
      background: #f8fafc; border-radius: 8px; padding: 11px 12px;
      margin-bottom: 8px; border: 2px solid #e2e8f0;
    }
    .pair-select-card.pair-ok   { border-color: #86efac; }
    .pair-select-card.pair-warn { border-color: #fca5a5; background: #fef2f2; }
    .pair-select-label {
      display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px;
    }
    .pair-select-label input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; }
    .pair-select-label .pair-title { font-weight: 700; color: #1e293b; }
    .pair-select-label .pair-ids   { color: #475569; font-size: 12px; margin-top: 2px; }
    .pair-select-wrap { display: flex; flex-direction: column; }
    .pair-select-actions {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .pair-select-actions button {
      padding: 6px 14px; border-radius: 6px; border: 1px solid #cbd5e1;
      background: #f1f5f9; font-size: 12px; cursor: pointer; color: #475569;
    }
    .pair-startno-row {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      padding-top: 8px; border-top: 1px dashed #fca5a5;
    }
    .pair-startno-row label { font-size: 12px; color: #92400e; font-weight: 600; white-space: nowrap; }
    .pair-startno-row input { width: 80px; padding: 4px 8px; border: 1px solid #f87171;
      border-radius: 6px; font-size: 13px; font-weight: 700; color: #1e293b; }
    .pair-startno-row span  { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
<div class="header">
  <button class="btn-back" onclick="history.back()">‹</button>
  <h1>📸 問題追加</h1>
  <span class="header-badge">β</span>
</div>

<div class="upload-page">

  <!-- モード切替 -->
  <div class="upload-section">
    <div class="upload-title">モード</div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-photo" onclick="switchMode('photo')">📷 写真・単体PDF</button>
      <button class="mode-tab"        id="tab-batch" onclick="switchMode('batch')">📄 連続PDF（一括）</button>
    </div>
  </div>

  <!-- 写真モード: 問題＋解説ページ -->
  <div class="upload-section" id="step-photo">
    <div class="upload-title">① 問題集の写真を選択</div>

    <div class="form-label" style="margin-bottom:6px">📄 問題ページ</div>
    <div class="file-input-wrap">
      <label class="file-input-btn" for="file-input-q">
        📷 問題ページを撮影 / 選択
      </label>
      <input type="file" id="file-input-q" accept="image/*,application/pdf" capture="environment">
    </div>
    <img id="preview-img-q" class="preview-img" style="display:none">

    <div class="form-label" style="margin-top:14px; margin-bottom:6px">📄 解説ページ（省略可）</div>
    <div class="file-input-wrap">
      <label class="file-input-btn" for="file-input-a" style="border-color:#a5b4fc">
        📷 解説ページを撮影 / 選択
      </label>
      <input type="file" id="file-input-a" accept="image/*,application/pdf" capture="environment">
    </div>
    <img id="preview-img-a" class="preview-img" style="display:none">
  </div>

  <!-- 連続PDFモード -->
  <div class="upload-section" id="step-batch" style="display:none">
    <div class="upload-title">① 連続PDFを選択</div>
    <div style="font-size:12px; color:#64748b; margin-bottom:10px; line-height:1.6;">
      問題ページ（左）・解説ページ（右）が交互に並んだPDFを選択してください。<br>
      ページペアごとに順番に抽出し、まとめてプレビューします。
    </div>
    <div class="file-input-wrap">
      <label class="file-input-btn" for="file-input-pdf" style="border-color:#818cf8; padding:30px 16px;">
        📂 連続PDFを選択
      </label>
      <input type="file" id="file-input-pdf" accept="application/pdf">
    </div>
    <div id="pdf-info" style="display:none; margin-top:10px; padding:10px 12px;
      background:#e0e7ff; border-radius:8px; font-size:13px; color:#4338ca; font-weight:600;"></div>
  </div>

  <!-- Step2: 設定 -->
  <div class="upload-section">
    <div class="upload-title">② 登録先を選択</div>
    <div class="form-row">
      <label class="form-label">登録先ファイル</label>
      <select id="subcat-file" class="form-select" onchange="loadSubcatInfo()">
        <option value="kousei_nenkin_01">厚生年金保険法 ①被保険者</option>
        <option value="kousei_nenkin_02">厚生年金保険法 ②標準報酬月額等</option>
        <option value="kousei_nenkin_03">厚生年金保険法 ③保険給付通則</option>
        <option value="kousei_nenkin_04">厚生年金保険法 ④老齢厚生年金（受給要件）</option>
        <option value="kousei_nenkin_05">厚生年金保険法 ⑤老齢厚生年金（年金額）</option>
        <option value="kousei_nenkin_06">厚生年金保険法 ⑥老齢厚生年金（加給年金額等）</option>
        <option value="kousei_nenkin_07">厚生年金保険法 ⑦老齢厚生年金（支給停止）</option>
        <option value="kousei_nenkin_08">厚生年金保険法 ⑧障害厚生年金（支給要件・年金額）</option>
        <option value="kousei_nenkin_09">厚生年金保険法 ⑨老齢厚生年金</option>
        <option value="kousei_nenkin_10">厚生年金保険法 ⑩障害厚生年金</option>
        <option value="kousei_nenkin_11">厚生年金保険法 ⑪障害手当金</option>
        <option value="kousei_nenkin_12">厚生年金保険法 ⑫遺族厚生年金（支給要件・年金額等）</option>
        <option value="kousei_nenkin_13">厚生年金保険法 ⑬遺族厚生年金（支給停止）</option>
        <option value="kousei_nenkin_14">厚生年金保険法 ⑭離婚の場合の特例</option>
        <option value="kousei_nenkin_15">厚生年金保険法 ⑮脱退一時金</option>
        <option value="kousei_nenkin_16">厚生年金保険法 ⑯年金額の改定等</option>
        <option value="kousei_nenkin_17">厚生年金保険法 ⑰２以上の種別の保険者の特例</option>
        <option value="kousei_nenkin_18">厚生年金保険法 ⑱保険給付の制限</option>
        <option value="kousei_nenkin_19">厚生年金保険法 ⑲保険料の額（保険料の額）</option>
        <option value="kousei_nenkin_20">厚生年金保険法 ⑳保険料の額（繰上調整）</option>
        <option value="kousei_nenkin_21">厚生年金保険法 ㉑雑則・罰則</option>
        <option value="kenkou_hoken_05">健康保険法 ⑤その他</option>
      </select>
      <div class="subcat-info-box loading" id="subcat-info">読み込み中…</div>
    </div>
    <div class="form-row">
      <label class="form-label">認証コード</label>
      <input type="password" id="upload-secret" class="form-input" placeholder="設定したパスワード">
    </div>
    <button class="btn-extract" id="btn-extract" onclick="extractQuestions()" disabled>
      <span id="extract-label">🔍 問題を抽出する</span>
      <span id="extract-spinner" class="spinner" style="display:none"></span>
    </button>

    <!-- 連続PDF進捗 -->
    <div id="batch-progress-wrap" style="display:none; margin-top:14px;">
      <div id="batch-status-text" style="font-size:13px; font-weight:600; color:#4338ca;"></div>
      <div class="batch-progress-bar-wrap">
        <div class="batch-progress-bar" id="batch-progress-bar" style="width:0%"></div>
      </div>
      <div class="batch-log" id="batch-log"></div>
      <button class="btn-cancel" id="btn-cancel" onclick="cancelBatch()" style="display:none;">
        🛑 送信停止
      </button>
    </div>
  </div>

  <!-- Step3: プレビュー -->
  <div class="upload-section" id="step-preview" style="display:none">
    <div class="upload-title">
      ③ 抽出結果を確認
      <span class="badge badge-count" id="q-count">0問</span>
    </div>
    <div id="preview-list"></div>
    <button class="btn-commit" id="btn-commit" onclick="commitQuestions()">
      ✅ GitHubに登録する
    </button>
    <div id="commit-status"></div>
  </div>

</div>

<script>
  let extractedQuestions = [];
  let fixedFileQ = null;
  let fixedFileA = null;
  let uploadMode = 'photo'; // 'photo' | 'batch'
  let batchPdfFile = null;
  let batchAbortController = null;
  let pairResults = []; // [{ pairNo, questions, ids }]

  // PDF.js ワーカー設定
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ===== 初期化 =====
  window.addEventListener('DOMContentLoaded', () => {
    const savedSecret = localStorage.getItem('upload_secret');
    if (savedSecret) document.getElementById('upload-secret').value = savedSecret;

    loadSubcatInfo();

    const savedUrl = localStorage.getItem('worker_url') || '';
    const isValidWorkerUrl = savedUrl.includes('workers.dev') || savedUrl.includes('localhost');

    if (!isValidWorkerUrl) {
      document.querySelector('.upload-page').insertAdjacentHTML('afterbegin', `
        <div class="upload-section" style="background:#fff3cd" id="worker-url-box">
          <div class="upload-title">⚠️ Worker URL を設定</div>
          ${savedUrl ? `<div style="font-size:12px;color:#92400e;margin-bottom:8px;">現在の値（無効）: ${savedUrl}</div>` : ''}
          <div class="form-row">
            <input type="url" id="worker-url-input" class="form-input"
              value="${savedUrl}"
              placeholder="https://sharoshi-quiz-worker.egoist1226.workers.dev">
          </div>
          <button class="btn-extract" onclick="saveWorkerUrl()" style="background:#d97706">保存する</button>
        </div>`);
    } else {
      document.querySelector('.upload-page').insertAdjacentHTML('afterbegin', `
        <div style="text-align:right; margin-bottom:4px;">
          <button onclick="showWorkerUrlEdit()" style="background:none;border:none;color:#94a3b8;font-size:12px;cursor:pointer;">⚙️ Worker URL 変更</button>
        </div>
        <div class="upload-section" style="background:#fff3cd;display:none" id="worker-url-box">
          <div class="upload-title">Worker URL を変更</div>
          <div class="form-row">
            <input type="url" id="worker-url-input" class="form-input"
              value="${savedUrl}"
              placeholder="https://sharoshi-quiz-worker.egoist1226.workers.dev">
          </div>
          <button class="btn-extract" onclick="saveWorkerUrl()" style="background:#d97706">保存する</button>
        </div>`);
    }
  });

  function showWorkerUrlEdit() {
    document.getElementById('worker-url-box').style.display = '';
  }

  function saveWorkerUrl() {
    const url = document.getElementById('worker-url-input').value.trim();
    if (!url) return;
    localStorage.setItem('worker_url', url);
    location.reload();
  }

  // ===== サブカテゴリ収録状況 =====
  async function loadSubcatInfo() {
    const el = document.getElementById('subcat-info');
    const subcatFile = document.getElementById('subcat-file').value;
    el.className = 'subcat-info-box loading';
    el.textContent = '読み込み中…';
    try {
      const res = await fetch(
        `https://raw.githubusercontent.com/egoist1226-coder/sharoshi-quiz/master/data/${subcatFile}.json`,
        { cache: 'no-store' }
      );
      if (!res.ok) { showSubcatInfo([], el); return; }
      const data = await res.json();
      showSubcatInfo(data, el);
    } catch(e) {
      el.className = 'subcat-info-box loading';
      el.textContent = '取得失敗（オフライン？）';
    }
  }

  function showSubcatInfo(data, el) {
    if (!el) el = document.getElementById('subcat-info');
    if (!Array.isArray(data) || data.length === 0) {
      el.className = 'subcat-info-box';
      el.innerHTML = '<span style="color:#64748b">収録済み: 0問（未登録）</span>';
      return;
    }
    const ids = data.map(q => q.id).filter(id => typeof id === 'number').sort((a, b) => a - b);
    const minId = ids[0], maxId = ids[ids.length - 1];
    const idSet = new Set(ids);
    const missing = [];
    for (let i = minId; i <= maxId; i++) { if (!idSet.has(i)) missing.push(i); }
    let html = `<span style="color:#166534;font-weight:600">収録済み: ${ids.length}問（問${minId}〜問${maxId}）</span>`;
    if (missing.length > 0) {
      el.className = 'subcat-info-box has-missing';
      html += `<br><span style="color:#92400e;font-weight:600">未収録: 問${missing.join('・問')}</span>`;
    } else {
      el.className = 'subcat-info-box';
    }
    el.innerHTML = html;
  }

  // ===== モード切替 =====
  function switchMode(mode) {
    uploadMode = mode;
    document.getElementById('tab-photo').classList.toggle('active', mode === 'photo');
    document.getElementById('tab-batch').classList.toggle('active', mode === 'batch');
    document.getElementById('step-photo').style.display  = mode === 'photo' ? '' : 'none';
    document.getElementById('step-batch').style.display  = mode === 'batch' ? '' : 'none';

    // リセット
    extractedQuestions = [];
    document.getElementById('step-preview').style.display = 'none';
    document.getElementById('batch-progress-wrap').style.display = 'none';

    if (mode === 'photo') {
      document.getElementById('btn-extract').disabled = !fixedFileQ;
    } else {
      document.getElementById('btn-extract').disabled = !batchPdfFile;
    }
  }

  // ===== 写真ファイル選択 =====
  function setupFileInput(inputId, previewId, isQ) {
    document.getElementById(inputId).addEventListener('change', function(e) {
      const raw = e.target.files[0];
      if (!raw) return;
      if (isQ) {
        fixedFileQ = raw;
        if (uploadMode === 'photo') document.getElementById('btn-extract').disabled = false;
      } else {
        fixedFileA = raw;
      }
      if (raw.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = document.getElementById(previewId);
          img.src = ev.target.result; img.style.display = 'block';
        };
        reader.readAsDataURL(raw);
      }
    });
  }
  setupFileInput('file-input-q', 'preview-img-q', true);
  setupFileInput('file-input-a', 'preview-img-a', false);

  // ===== 連続PDF選択 =====
  document.getElementById('file-input-pdf').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    batchPdfFile = file;

    // ページ数を確認
    try {
      const ab = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: ab }).promise;
      const total = doc.numPages;
      const pairs = Math.floor(total / 2);
      const infoEl = document.getElementById('pdf-info');
      infoEl.style.display = 'block';
      infoEl.textContent = `📋 ${total}ページ → ${pairs}ペア（問題${pairs}セット）を処理します`;
    } catch {
      document.getElementById('pdf-info').style.display = 'block';
      document.getElementById('pdf-info').textContent = 'PDFを読み込みました（ページ数取得不可）';
    }

    if (uploadMode === 'batch') document.getElementById('btn-extract').disabled = false;
  });

  // ===== メイン：抽出ボタン =====
  async function extractQuestions() {
    if (uploadMode === 'batch') return extractBatchPdf();

    // --- 写真モード（既存ロジック）---
    const fileQ = fixedFileQ;
    const fileA = fixedFileA;
    const secret    = document.getElementById('upload-secret').value.trim();
    const workerUrl = (localStorage.getItem('worker_url') || '').trim();

    if (!fileQ)     return alert('問題ページの写真を選択してください');
    if (!secret)    return alert('認証コードを入力してください');
    if (!workerUrl) return alert('Worker URLを設定してください');

    localStorage.setItem('upload_secret', secret);
    setExtracting(true);
    try {
      let body;
      const isPdfQ = fileQ.type === 'application/pdf';
      const isPdfA = fileA && fileA.type === 'application/pdf';
      if (fileA) {
        // PDFの場合はJPEGに変換して送信
        const imgQ = isPdfQ
          ? await renderPdfPageToJpeg(await pdfjsLib.getDocument({ data: await fileQ.arrayBuffer() }).promise, 0)
          : (await fileToBase64(fileQ)).split(',')[1];
        const imgA = isPdfA
          ? await renderPdfPageToJpeg(await pdfjsLib.getDocument({ data: await fileA.arrayBuffer() }).promise, 0)
          : (await fileToBase64(fileA)).split(',')[1];
        body = { imageQ: imgQ, mimeTypeQ: 'image/jpeg', imageA: imgA, mimeTypeA: 'image/jpeg' };
      } else {
        if (isPdfQ) {
          const pdfDoc = await pdfjsLib.getDocument({ data: await fileQ.arrayBuffer() }).promise;
          const img = await renderPdfPageToJpeg(pdfDoc, 0);
          body = { image: img, mimeType: 'image/jpeg' };
        } else {
          const b64 = await fileToBase64(fileQ);
          body = { image: b64.split(',')[1], mimeType: 'image/jpeg' };
        }
      }

      const res = await fetchWithTimeout(`${workerUrl}/extract`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Upload-Secret': secret },
        body: JSON.stringify(body)
      }, 120000);
      if (res.status === 401) throw new Error(`認証エラー(401)。認証コード: "${secret}"`);
      const data = await res.json();
      if (!res.ok || !data.success)
        throw new Error((data.error || 'Extraction failed') + (data.detail ? '\n' + data.detail : ''));

      extractedQuestions = data.questions;
      showPreview(extractedQuestions);
    } catch (err) {
      alert('エラー: ' + err.message);
    } finally {
      setExtracting(false);
    }
  }

  // ===== 連続PDF一括抽出 =====
  async function extractBatchPdf() {
    const secret    = document.getElementById('upload-secret').value.trim();
    const workerUrl = (localStorage.getItem('worker_url') || '').trim();

    if (!batchPdfFile) return alert('PDFファイルを選択してください');
    if (!secret)       return alert('認証コードを入力してください');
    if (!workerUrl)    return alert('Worker URLを設定してください');

    localStorage.setItem('upload_secret', secret);

    // PDFを読み込んでページ数を確認
    let pdfDoc, pairs;
    try {
      const ab = await batchPdfFile.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: ab }).promise;
      const total = pdfDoc.numPages;
      pairs = [];
      for (let i = 0; i + 1 < total; i += 2) {
        pairs.push({ pairNo: i / 2 + 1, pageQ: i, pageA: i + 1 });
      }
    } catch(e) {
      return alert('PDF読み込みエラー: ' + e.message);
    }

    if (pairs.length === 0) return alert('有効なページペアが見つかりません（ページ数が偶数でない可能性があります）');

    setExtracting(true);
    extractedQuestions = [];
    pairResults = [];
    const errorItems = [];

    // 中断コントローラー初期化・停止ボタン表示
    batchAbortController = new AbortController();
    document.getElementById('btn-cancel').style.display = 'block';

    // 進捗UI初期化
    document.getElementById('batch-progress-wrap').style.display = 'block';
    document.getElementById('batch-log').innerHTML = '';
    updateBatchProgress(0, pairs.length, '処理を開始します...');
    addBatchLog(`Worker URL: ${workerUrl}`, 'info');

    for (const pair of pairs) {
      if (batchAbortController.signal.aborted) {
        addBatchLog('🛑 ユーザーにより停止されました', 'err');
        break;
      }

      updateBatchProgress(pair.pairNo - 1, pairs.length, `ペア ${pair.pairNo} / ${pairs.length} を抽出中...`);

      // OCRテキスト抽出（Adobe Scan のテキスト層を直接使用）
      let body;
      try {
        const textQ = await extractPdfPageText(pdfDoc, pair.pageQ);
        const textA = await extractPdfPageText(pdfDoc, pair.pageA);

        if (textQ && textA && textQ.trim().length > 30) {
          // OCRテキストが取得できた場合（Adobe Scan等）
          addBatchLog(`ペア ${pair.pairNo} 送信中... (OCR ${textQ.length + textA.length} 文字)`, 'info');
          body = { textQ, textA };
        } else {
          // テキスト層がない場合はJPEGにフォールバック
          const imgQ = await renderPdfPageToJpeg(pdfDoc, pair.pageQ);
          const imgA = await renderPdfPageToJpeg(pdfDoc, pair.pageA);
          const pairSizeKB = Math.round((imgQ.length + imgA.length) / 1024);
          addBatchLog(`ペア ${pair.pairNo} 送信中... (JPEG ${pairSizeKB} KB)`, 'info');
          body = { imageQ: imgQ, mimeTypeQ: 'image/jpeg', imageA: imgA, mimeTypeA: 'image/jpeg' };
        }
      } catch(e) {
        addBatchLog(`ペア ${pair.pairNo} ❌ PDF読取エラー: ${e.message}`, 'err');
        errorItems.push({ pairNo: pair.pairNo, msg: 'PDF読取エラー: ' + e.message });
        continue;
      }

      try {
        const res = await fetchWithTimeout(`${workerUrl}/extract`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Upload-Secret': secret },
          body: JSON.stringify(body)
        }, 120000, batchAbortController.signal);
        const data = await res.json();

        if (!res.ok || !data.success) {
          const msg = `[HTTP ${res.status}] ${data.error || '抽出失敗'}${data.detail ? ' / ' + data.detail : ''}`;
          errorItems.push({ pairNo: pair.pairNo, msg });
          addBatchLog(`ペア ${pair.pairNo} ❌ ${msg}`, 'err');
        } else {
          const pairIds = data.questions.map(q => q.id).filter(id => typeof id === 'number').sort((a, b) => a - b);
          pairResults.push({ pairNo: pair.pairNo, questions: data.questions, ids: pairIds });
          extractedQuestions.push(...data.questions);
          const idRange = pairIds.length > 0 ? ` [問${pairIds[0]}〜${pairIds[pairIds.length - 1]}]` : '';
          const rev = data.review_count > 0 ? ` ⚠️ 要確認${data.review_count}問` : '';
          addBatchLog(`ペア ${pair.pairNo} ✅ ${data.questions.length}問取得${rev}${idRange}`, 'ok');
        }
      } catch(e) {
        const msg = e.message || '通信エラー';
        errorItems.push({ pairNo: pair.pairNo, msg });
        addBatchLog(`ペア ${pair.pairNo} ❌ ${msg}`, 'err');
        if (batchAbortController.signal.aborted) break;
      }
    }

    // 停止ボタンを隠す
    document.getElementById('btn-cancel').style.display = 'none';
    batchAbortController = null;

    const cancelled = document.getElementById('batch-status-text').textContent.includes('停止');
    const summary = cancelled
      ? `停止 — ${extractedQuestions.length}問を取得済み`
      : `完了 — 全${extractedQuestions.length}問を取得しました`;
    updateBatchProgress(pairs.length, pairs.length, summary);

    // ===== 問題数の整合性チェック =====
    if (!cancelled && extractedQuestions.length > 0) {
      const allIds = extractedQuestions.map(q => q.id).filter(id => typeof id === 'number');
      if (allIds.length > 0) {
        const minId = Math.min(...allIds);
        const maxId = Math.max(...allIds);
        const expected = maxId - minId + 1;
        const actual = allIds.length;
        if (actual === expected) {
          addBatchLog(`✅ 問題数確認OK: ${actual}問（問${minId}〜${maxId}）`, 'ok');
        } else {
          addBatchLog(`⚠️ 問題数不一致: 取得${actual}問 / 期待${expected}問（問${minId}〜${maxId}）`, 'err');
          addBatchLog('── ペア別内訳 ──', 'info');
          for (const pr of pairResults) {
            if (pr.ids.length === 0) {
              addBatchLog(`  ペア${pr.pairNo}: 取得なし`, 'err');
            } else {
              const pMin = pr.ids[0];
              const pMax = pr.ids[pr.ids.length - 1];
              const pExpected = pMax - pMin + 1;
              const ok = pr.ids.length === pExpected;
              const mark = ok ? '✅' : '❌';
              addBatchLog(`  ${mark} ペア${pr.pairNo}: 問${pMin}〜${pMax} ${pr.ids.length}問${ok ? '' : `（期待${pExpected}問）`}`, ok ? 'ok' : 'err');
            }
          }
        }
      }
    }

    setExtracting(false);
    if (extractedQuestions.length > 0) showPreview(extractedQuestions, errorItems);
  }

  // Adobe Scan等のOCRテキスト層を抽出（画像変換不要）
  async function extractPdfPageText(pdfJsDoc, pageIndex) {
    const page = await pdfJsDoc.getPage(pageIndex + 1);
    const textContent = await page.getTextContent();
    if (!textContent.items || textContent.items.length === 0) return null;

    // Y座標でグループ化して行順に並べる（PDF座標は下から上なので降順）
    const lineMap = new Map();
    for (const item of textContent.items) {
      if (!item.str) continue;
      const y = Math.round(item.transform[5] / 4) * 4;
      if (!lineMap.has(y)) lineMap.set(y, []);
      lineMap.get(y).push({ x: item.transform[4], str: item.str });
    }
    return [...lineMap.entries()]
      .sort((a, b) => b[0] - a[0])
      .map(([, items]) => items.sort((a, b) => a.x - b.x).map(i => i.str).join(''))
      .join('\n');
  }

  // PDFの指定ページをJPEG base64に変換（OCRなし時のフォールバック）
  async function renderPdfPageToJpeg(pdfJsDoc, pageIndex) {
    const page = await pdfJsDoc.getPage(pageIndex + 1); // PDF.jsは1始まり
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    return dataUrl.replace(/^data:image\/jpeg;base64,/, '');
  }

  function updateBatchProgress(done, total, text) {
    document.getElementById('batch-status-text').textContent = text;
    document.getElementById('batch-progress-bar').style.width = `${Math.round((done / total) * 100)}%`;
  }

  function addBatchLog(msg, type) {
    const log = document.getElementById('batch-log');
    const el = document.createElement('div');
    el.className = `batch-log-item ${type}`;
    el.textContent = msg;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  // ===== プレビュー表示 =====
  function showPreview(questions, errors = []) {
    document.getElementById('step-preview').style.display = 'block';
    document.getElementById('q-count').textContent = `${questions.length}問`;

    const list = document.getElementById('preview-list');

    if (uploadMode === 'batch' && pairResults.length > 0) {
      // ---- 一括モード：ペア選択カード ----
      const errHtml = errors.map(e => `
        <div class="review-error-card">
          <strong>⚠️ ペア ${e.pairNo} 抽出失敗</strong> ${e.msg}
        </div>`).join('');

      const pairCards = pairResults.map(pr => {
        const ids = pr.ids;
        const n = pr.questions.length;
        const seqUndetected = isSequentialFrom1(ids); // 赤背景白抜きのためOCR不可
        const minId = ids.length > 0 ? Math.min(...ids) : '?';
        const maxId = ids.length > 0 ? Math.max(...ids) : '?';
        const pExpected = (!seqUndetected && ids.length > 0) ? (maxId - minId + 1) : n;
        const hasGap = !seqUndetected && ids.length > 0 && ids.length !== pExpected;
        const cardClass = (seqUndetected || hasGap) ? 'pair-warn' : 'pair-ok';
        const autoCheck = !seqUndetected && !hasGap;

        let statusLine, startNoRow;
        if (seqUndetected) {
          statusLine = `<span class="pair-title">ペア ${pr.pairNo}：${n}問取得 ⚠️ 問番号未検出（赤背景白抜き）</span>
                        <span class="pair-ids">OCRで番号読取不可 — 下欄に開始番号を入力してください</span>`;
          startNoRow = `
            <div class="pair-startno-row">
              <label for="pair-startno-${pr.pairNo}">開始問題番号:</label>
              <input type="number" id="pair-startno-${pr.pairNo}" placeholder="例: 415" min="1"
                     oninput="updatePairPreview(${pr.pairNo})">
              <span id="pair-startno-preview-${pr.pairNo}">${n}問を連番で登録</span>
            </div>`;
        } else if (hasGap) {
          const idList = ids.map(id => `問${id}`).join('・');
          statusLine = `<span class="pair-title">ペア ${pr.pairNo}：${n}問取得 ⚠️ 欠番あり（期待${pExpected}問）</span>
                        <span class="pair-ids">問${minId}〜問${maxId}　${idList}</span>`;
          startNoRow = '';
        } else {
          const idList = ids.map(id => `問${id}`).join('・');
          statusLine = `<span class="pair-title">ペア ${pr.pairNo}：${n}問取得</span>
                        <span class="pair-ids">問${minId}〜問${maxId}　${idList}</span>`;
          startNoRow = '';
        }

        return `
          <div class="pair-select-card ${cardClass}">
            <label class="pair-select-label">
              <input type="checkbox" id="pair-check-${pr.pairNo}" ${autoCheck ? 'checked' : ''}>
              <div class="pair-select-wrap">${statusLine}</div>
            </label>
            ${startNoRow}
          </div>`;
      }).join('');

      list.innerHTML = `
        <div class="pair-select-actions">
          <button onclick="setAllPairChecks(true)">すべて選択</button>
          <button onclick="setAllPairChecks(false)">すべて解除</button>
        </div>
        ${errHtml}${pairCards}`;
    } else {
      // ---- 単体モード：問題カード ----
      list.innerHTML = questions.map(q => `
        <div class="q-card ${q.review_needed ? 'review-needed' : ''}">
          <div class="q-id">問${q.id}（${q.category}）${q.review_needed ? ' ⚠️要確認' : ''}</div>
          <div class="q-text">${q.question}</div>
          <div class="q-answer ${q.answer ? '' : 'wrong'}">
            答：${q.answer ? '○（正しい）' : '×（誤り）'}
          </div>
          <div class="q-exp">${q.explanation || ''}</div>
          ${q.review_needed ? `<div style="margin-top:6px;color:#b45309;font-size:11px;font-weight:600;">${q.review_info || ''}</div>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('step-preview').scrollIntoView({ behavior: 'smooth' });
  }

  function setAllPairChecks(checked) {
    pairResults.forEach(pr => {
      const cb = document.getElementById(`pair-check-${pr.pairNo}`);
      if (cb) cb.checked = checked;
    });
  }

  function isSequentialFrom1(ids) {
    if (ids.length === 0) return false;
    return ids.every((id, i) => id === i + 1);
  }

  function updatePairPreview(pairNo) {
    const pr = pairResults.find(p => p.pairNo === pairNo);
    if (!pr) return;
    const startNo = parseInt(document.getElementById(`pair-startno-${pairNo}`)?.value, 10);
    const el = document.getElementById(`pair-startno-preview-${pairNo}`);
    if (!el) return;
    if (startNo > 0) {
      const end = startNo + pr.questions.length - 1;
      el.textContent = `→ 問${startNo}〜問${end}（${pr.questions.length}問）`;
      el.style.color = '#166534';
    } else {
      el.textContent = `${pr.questions.length}問を連番で登録`;
      el.style.color = '';
    }
  }

  // ===== コミット =====
  async function commitQuestions() {
    // 一括モードはチェック済みペアのみ、単体モードは全問
    let questionsToCommit;
    if (uploadMode === 'batch' && pairResults.length > 0) {
      const checkedPairs = pairResults.filter(pr => document.getElementById(`pair-check-${pr.pairNo}`)?.checked);
      if (checkedPairs.length === 0) {
        alert('登録するペアを1つ以上選択してください。');
        return;
      }
      questionsToCommit = [];
      for (const pr of checkedPairs) {
        const startNoInput = document.getElementById(`pair-startno-${pr.pairNo}`);
        const startNo = startNoInput ? parseInt(startNoInput.value, 10) : NaN;
        if (!isNaN(startNo) && startNo > 0) {
          // 開始番号が指定されている場合：そのペアだけ独立して番号を振り直す
          const renumbered = pr.questions.map((q, i) => ({ ...q, id: startNo + i, source_no: startNo + i }));
          questionsToCommit.push(...renumbered);
        } else if (isSequentialFrom1(pr.ids)) {
          // 番号未検出で開始番号も未入力：コミット拒否
          alert(`ペア${pr.pairNo}の開始問題番号が未入力です。入力してから再度お試しください。`);
          return;
        } else {
          questionsToCommit.push(...pr.questions);
        }
      }
    } else {
      questionsToCommit = extractedQuestions;
    }
    if (questionsToCommit.length === 0) return;

    const secret     = document.getElementById('upload-secret').value;
    const subcatFile = document.getElementById('subcat-file').value;
    const workerUrl  = localStorage.getItem('worker_url');
    const statusEl   = document.getElementById('commit-status');
    const btn        = document.getElementById('btn-commit');

    btn.disabled = true;
    statusEl.innerHTML = '<div class="status-box loading">📡 GitHubにコミット中…</div>';

    try {
      const res = await fetch(`${workerUrl}/commit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Upload-Secret': secret },
        body: JSON.stringify({ questions: questionsToCommit, subcatFile })
      });
      const data = await res.json();
      if (!res.ok || !data.success)
        throw new Error((data.error || 'Commit failed') + (data.detail ? '\n' + data.detail : ''));

      statusEl.innerHTML = `
        <div class="status-box success">
          ✅ ${data.added}問を登録しました！<br>
          GitHub Pages に反映されるまで約5〜10分かかります。
        </div>`;
      loadSubcatInfo();
    } catch (err) {
      statusEl.innerHTML = `<div class="status-box error">❌ ${err.message}</div>`;
      btn.disabled = false;
    }
  }

  // ===== ユーティリティ =====
  function setExtracting(loading) {
    document.getElementById('btn-extract').disabled = loading;
    document.getElementById('extract-label').style.display  = loading ? 'none'         : 'inline';
    document.getElementById('extract-spinner').style.display = loading ? 'inline-block' : 'none';
  }

  function fetchWithTimeout(url, options, ms, externalSignal = null) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    if (externalSignal) {
      externalSignal.addEventListener('abort', () => controller.abort());
    }
    return fetch(url, { ...options, signal: controller.signal })
      .then(r => { clearTimeout(timer); return r; })
      .catch(e => {
        clearTimeout(timer);
        if (e.name === 'AbortError') {
          if (externalSignal?.aborted) throw new Error('ユーザーにより停止されました');
          throw new Error(`タイムアウト（${ms/1000}秒超過）`);
        }
        throw e;
      });
  }

  function cancelBatch() {
    if (batchAbortController) {
      batchAbortController.abort();
      addBatchLog('🛑 停止リクエストを送信しました...', 'err');
      document.getElementById('btn-cancel').disabled = true;
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
</script>
