<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>問題追加 - 社労士</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .upload-page { max-width: 600px; margin: 0 auto; padding: 16px; }
    .upload-section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .upload-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #1e293b; }
    .file-input-wrap { position: relative; }
    .file-input-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 40px 16px; border: 2px dashed #cbd5e1;
      border-radius: 12px; background: #f8fafc; cursor: pointer;
      font-size: 15px; color: #64748b; font-weight: 600;
    }
    .file-input-btn:active { background: #e2e8f0; }
    #file-input { display: none; }
    .preview-img { width: 100%; border-radius: 8px; margin-top: 12px; max-height: 400px; object-fit: contain; }
    .btn-rotate {
      width: 100%; padding: 10px; background: #ea580c; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 8px; display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .btn-rotate:active { background: #c2410c; }
    .rotate-deg { font-size: 12px; opacity: 0.85; }
    .form-row { margin-bottom: 12px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-select, .form-input {
      width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0;
      border-radius: 8px; font-size: 14px; color: #1e293b;
    }
    .btn-extract {
      width: 100%; padding: 14px; background: #4f46e5; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-extract:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-commit {
      width: 100%; padding: 14px; background: #16a34a; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 12px;
    }
    .btn-commit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back { background: none; border: none; color: #64748b; font-size: 22px; cursor: pointer; }
    .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .q-card { background: #f8fafc; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
    .q-id { font-weight: 700; color: #4f46e5; margin-bottom: 4px; }
    .q-text { margin-bottom: 6px; line-height: 1.5; }
    .q-answer { font-weight: 600; color: #16a34a; }
    .q-answer.wrong { color: #dc2626; }
    .q-exp { color: #475569; margin-top: 6px; font-size: 12px; line-height: 1.5; }
    .status-box { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 8px; text-align: center; }
    .status-box.success { background: #dcfce7; color: #166534; }
    .status-box.error   { background: #fee2e2; color: #991b1b; }
    .status-box.loading { background: #ede9fe; color: #4338ca; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .badge-count { background: #e0e7ff; color: #4338ca; }
    .badge-warn  { background: #fef3c7; color: #92400e; }
    /* 要確認カード */
    .q-card.review-needed { background: #fffbeb; border: 2px solid #f59e0b; }
    .q-card.review-needed .q-id { color: #b45309; }
    .review-badge { display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 1px 6px; margin-left: 6px; }
    .review-info  { background: #fef9c3; border-left: 3px solid #f59e0b; padding: 6px 8px; margin-top: 6px; font-size: 11px; color: #78350f; line-height: 1.5; }
    .review-input { width: 100%; padding: 8px; border: 1px solid #f59e0b; border-radius: 6px; font-size: 13px; line-height: 1.6; margin-top: 6px; resize: vertical; min-height: 60px; box-sizing: border-box; }
    .review-save  { width: 100%; padding: 7px; background: #d97706; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .review-save:active { background: #b45309; }
    .review-warn-box { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #78350f; font-weight: 600; margin-bottom: 10px; }
    .pdf-indicator { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 14px; font-weight: 600; color: #1e40af; }
  </style>
</head>
<body>
<div class="header">
  <button class="btn-back" onclick="history.back()">‹</button>
  <h1>📸 問題追加</h1>
  <span class="header-badge">β</span>
</div>

<div class="upload-page">

  <!-- Step1: 写真選択 -->
  <div class="upload-section" id="step-photo">
    <div class="upload-title">① 問題集の写真を選択</div>

    <!-- 問題ページ -->
    <div class="form-label" style="margin-bottom:6px">📄 問題ページ</div>
    <div class="file-input-wrap">
      <label class="file-input-btn" for="file-input-q">
        📷 問題ページを撮影 / 選択（PDF可）
      </label>
      <input type="file" id="file-input-q" accept="image/*,application/pdf">
    </div>
    <img id="preview-img-q" class="preview-img" style="display:none">
    <div id="rotate-wrap-q" style="display:none">
      <button class="btn-rotate" onclick="rotateLeft(true)">
        ↺ 左に90°回転
        <span class="rotate-deg" id="rotate-label-q"></span>
      </button>
    </div>

    <!-- 解説ページ -->
    <div class="form-label" style="margin-top:14px; margin-bottom:6px">📄 解説ページ（省略可）</div>
    <div class="file-input-wrap">
      <label class="file-input-btn" for="file-input-a" style="border-color:#a5b4fc">
        📷 解説ページを撮影 / 選択（PDF可）
      </label>
      <input type="file" id="file-input-a" accept="image/*,application/pdf">
    </div>
    <img id="preview-img-a" class="preview-img" style="display:none">
    <div id="rotate-wrap-a" style="display:none">
      <button class="btn-rotate" onclick="rotateLeft(false)">
        ↺ 左に90°回転
        <span class="rotate-deg" id="rotate-label-a"></span>
      </button>
    </div>
  </div>

  <!-- Step2: 設定 -->
  <div class="upload-section">
    <div class="upload-title">② 登録先を選択</div>
    <div class="form-row">
      <label class="form-label">登録先ファイル</label>
      <select id="subcat-file" class="form-select">
        <option value="kousei_nenkin_10">厚生年金保険法 ⑩障害厚生年金</option>
        <option value="kousei_nenkin_11">厚生年金保険法 ⑪障害手当金</option>
        <option value="kousei_nenkin_12">厚生年金保険法 ⑫遺族厚生年金</option>
        <option value="kousei_nenkin_13">厚生年金保険法 ⑬遺族厚生年金（支給停止、失権等）</option>
        <option value="kenkou_hoken_05">健康保険法 ⑤その他</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">認証コード</label>
      <input type="password" id="upload-secret" class="form-input" placeholder="設定したパスワード">
    </div>
    <button class="btn-extract" id="btn-extract" onclick="extractQuestions()" disabled>
      <span id="extract-label">🔍 問題を抽出する</span>
      <span id="extract-spinner" class="spinner" style="display:none"></span>
    </button>
  </div>

  <!-- Step3: プレビュー -->
  <div class="upload-section" id="step-preview" style="display:none">
    <div class="upload-title">
      ③ 抽出結果を確認
      <span class="badge badge-count" id="q-count">0問</span>
      <span class="badge badge-warn" id="review-count" style="display:none">⚠️ 0要確認</span>
    </div>
    <div id="review-warn-box" class="review-warn-box" style="display:none"></div>
    <div id="preview-list"></div>
    <button class="btn-commit" id="btn-commit" onclick="commitQuestions()">
      ✅ GitHubに登録する
    </button>
    <div id="commit-status"></div>
  </div>

</div>

<script>
  let extractedQuestions = [];
  let fixedFileQ = null;
  let fixedFileA = null;
  // 左回転の累積角度（90度単位）
  let rotationQ = 0;
  let rotationA = 0;

  // ===== 初期化：保存済みの値を復元 =====
  window.addEventListener('DOMContentLoaded', () => {
    const savedSecret = localStorage.getItem('upload_secret');
    if (savedSecret) document.getElementById('upload-secret').value = savedSecret;

    if (!localStorage.getItem('worker_url')) {
      document.querySelector('.upload-page').insertAdjacentHTML('afterbegin', `
        <div class="upload-section" style="background:#fff3cd">
          <div class="upload-title">⚠️ Worker URL を設定</div>
          <div class="form-row">
            <input type="url" id="worker-url-input" class="form-input"
              placeholder="https://sharoshi-quiz-worker.egoist1226.workers.dev">
          </div>
          <button class="btn-extract" onclick="saveWorkerUrl()" style="background:#d97706">保存する</button>
        </div>`);
    }
  });

  function saveWorkerUrl() {
    const url = document.getElementById('worker-url-input').value.trim();
    if (!url) return;
    localStorage.setItem('worker_url', url);
    location.reload();
  }

  // ===== ファイル選択＋プレビュー =====
  function setupFileInput(inputId, previewId, isQ) {
    document.getElementById(inputId).addEventListener('change', function(e) {
      const raw = e.target.files[0];
      if (!raw) return;
      const isPdf = raw.type === 'application/pdf';
      if (isQ) {
        fixedFileQ = raw;
        rotationQ = 0;
        document.getElementById('rotate-label-q').textContent = '';
        document.getElementById('rotate-wrap-q').style.display = isPdf ? 'none' : 'block';
        document.getElementById('btn-extract').disabled = false;
      } else {
        fixedFileA = raw;
        rotationA = 0;
        document.getElementById('rotate-label-a').textContent = '';
        document.getElementById('rotate-wrap-a').style.display = isPdf ? 'none' : 'block';
      }
      const imgEl = document.getElementById(previewId);
      // PDF専用インジケーター要素を取得 or 作成
      let pdfEl = document.getElementById(previewId + '-pdf');
      if (!pdfEl) {
        pdfEl = document.createElement('div');
        pdfEl.id = previewId + '-pdf';
        pdfEl.className = 'pdf-indicator';
        imgEl.parentNode.insertBefore(pdfEl, imgEl.nextSibling);
      }
      if (isPdf) {
        // PDF: ファイル名とサイズを表示し画像プレビューは非表示
        imgEl.style.display = 'none';
        pdfEl.style.display = 'block';
        pdfEl.innerHTML = `📄 ${raw.name}<br><span style="font-size:11px;color:#64748b">PDF（${(raw.size/1024).toFixed(0)} KB）</span>`;
      } else {
        // 画像: プレビュー表示（元画像のまま）
        pdfEl.style.display = 'none';
        const reader = new FileReader();
        reader.onload = ev => {
          imgEl.src = ev.target.result;
          imgEl.style.display = 'block';
        };
        reader.readAsDataURL(raw);
      }
    });
  }
  setupFileInput('file-input-q', 'preview-img-q', true);
  setupFileInput('file-input-a', 'preview-img-a', false);

  // ===== 左回転ボタン =====
  function rotateLeft(isQ) {
    if (isQ) {
      rotationQ = (rotationQ + 90) % 360;
      redrawPreview(fixedFileQ, 'preview-img-q', rotationQ);
      document.getElementById('rotate-label-q').textContent =
        rotationQ === 0 ? '' : `（現在 ${rotationQ}°回転済み）`;
    } else {
      rotationA = (rotationA + 90) % 360;
      redrawPreview(fixedFileA, 'preview-img-a', rotationA);
      document.getElementById('rotate-label-a').textContent =
        rotationA === 0 ? '' : `（現在 ${rotationA}°回転済み）`;
    }
  }

  // canvasで画像を左回転して表示
  function redrawPreview(file, imgId, degrees) {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        // 90/270度は縦横を入れ替える
        if (degrees === 90 || degrees === 270) {
          canvas.width  = img.naturalHeight;
          canvas.height = img.naturalWidth;
        } else {
          canvas.width  = img.naturalWidth;
          canvas.height = img.naturalHeight;
        }
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-(degrees * Math.PI) / 180); // 負数 = 左回転（反時計回り）
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        document.getElementById(imgId).src = canvas.toDataURL('image/jpeg', 0.85);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 回転済み画像をbase64で取得（送信用）
  function getRotatedBase64(file, degrees) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        if (degrees === 0) { resolve(ev.target.result); return; }
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          if (degrees === 90 || degrees === 270) {
            canvas.width  = img.naturalHeight;
            canvas.height = img.naturalWidth;
          } else {
            canvas.width  = img.naturalWidth;
            canvas.height = img.naturalHeight;
          }
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(-(degrees * Math.PI) / 180);
          ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // PDFファイルをbase64に変換（回転不要）
  function getPdfBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => resolve(ev.target.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ===== 問題抽出 =====
  async function extractQuestions() {
    const fileQ = fixedFileQ;
    const fileA = fixedFileA;
    const secret    = document.getElementById('upload-secret').value.trim();
    const workerUrl = (localStorage.getItem('worker_url') || '').trim();

    if (!fileQ)     return alert('問題ページの写真を選択してください');
    if (!secret)    return alert('認証コードを入力してください');
    if (!workerUrl) return alert('Worker URLを設定してください');

    localStorage.setItem('upload_secret', secret);
    setExtracting(true);
    try {
      let body;

      // ファイルタイプ判定（画像 or PDF）
      const isQPdf = fileQ.type === 'application/pdf';
      const isAPdf = fileA ? fileA.type === 'application/pdf' : false;

      if (fileA) {
        // 2ページモード：画像はcanvas回転、PDFはそのままbase64
        const [b64Q, b64A] = await Promise.all([
          isQPdf ? getPdfBase64(fileQ) : getRotatedBase64(fileQ, rotationQ).then(s => s.split(',')[1]),
          isAPdf ? getPdfBase64(fileA) : getRotatedBase64(fileA, rotationA).then(s => s.split(',')[1]),
        ]);
        body = {
          ...(isQPdf ? { pdfQ: b64Q } : { imageQ: b64Q, mimeTypeQ: 'image/jpeg' }),
          ...(isAPdf ? { pdfA: b64A } : { imageA: b64A, mimeTypeA: 'image/jpeg' }),
        };
      } else {
        // 1ページモード
        if (isQPdf) {
          const b64 = await getPdfBase64(fileQ);
          body = { pdf: b64 };
        } else {
          const b64 = await getRotatedBase64(fileQ, rotationQ);
          body = { image: b64.split(',')[1], mimeType: 'image/jpeg' };
        }
      }

      const res = await fetch(`${workerUrl}/extract`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Upload-Secret': secret },
        body: JSON.stringify(body)
      });

      if (res.status === 401) throw new Error(`認証エラー(401)。認証コード: "${secret}"`);

      const data = await res.json();
      if (!res.ok || !data.success)
        throw new Error((data.error || 'Extraction failed') + (data.detail ? '\n' + data.detail : ''));

      extractedQuestions = data.questions;
      showPreview(extractedQuestions);

    } catch (err) {
      alert('エラー: ' + err.message);
    } finally {
      setExtracting(false);
    }
  }

  // プレビュー表示
  function showPreview(questions) {
    document.getElementById('step-preview').style.display = 'block';

    const reviewCount = questions.filter(q => q.review_needed).length;
    document.getElementById('q-count').textContent = `${questions.length}問`;

    // 要確認バッジ・警告ボックス
    const reviewBadge = document.getElementById('review-count');
    const warnBox     = document.getElementById('review-warn-box');
    const commitBtn   = document.getElementById('btn-commit');
    if (reviewCount > 0) {
      reviewBadge.textContent = `⚠️ ${reviewCount}要確認`;
      reviewBadge.style.display = 'inline-block';
      warnBox.style.display = 'block';
      warnBox.textContent =
        `⚠️ ${reviewCount}問の問題文が文字数チェックを通過できませんでした。` +
        `黄色の問題の「問題文」欄を原文と照合し、手動で修正してから登録してください。` +
        `修正が完了するまで登録ボタンは押せません。`;
      commitBtn.disabled = true;
    } else {
      reviewBadge.style.display = 'none';
      warnBox.style.display = 'none';
      commitBtn.disabled = false;
    }

    const list = document.getElementById('preview-list');
    list.innerHTML = questions.map((q, idx) => {
      const isReview = !!q.review_needed;
      const cardClass = isReview ? 'q-card review-needed' : 'q-card';
      const reviewBadgeHtml = isReview ? `<span class="review-badge">⚠️ 要確認</span>` : '';
      const reviewInfoHtml  = isReview
        ? `<div class="review-info">📏 ${q.review_info || '文字数チェック失敗'}<br>問題文を原文と照合して修正してください。</div>
           <textarea class="review-input" id="review-text-${idx}" rows="4">${q.question}</textarea>
           <button class="review-save" onclick="saveReviewEdit(${idx})">✅ この問題文で確定する</button>`
        : '';
      return `
        <div class="q-card ${isReview ? 'review-needed' : ''}" id="qcard-${idx}">
          <div class="q-id">問${q.id}（${q.category}）${reviewBadgeHtml}</div>
          <div class="q-text" id="qtext-${idx}">${q.question}</div>
          <div class="q-answer ${q.answer ? '' : 'wrong'}">
            答：${q.answer ? '○（正しい）' : '×（誤り）'}
          </div>
          <div class="q-exp">${q.explanation}</div>
          ${reviewInfoHtml}
        </div>
      `;
    }).join('');

    document.getElementById('step-preview').scrollIntoView({ behavior: 'smooth' });
  }

  // 要確認問題の問題文を手動修正して確定
  function saveReviewEdit(idx) {
    const textarea = document.getElementById(`review-text-${idx}`);
    const newText  = textarea.value.trim();
    if (!newText) return alert('問題文を入力してください');

    // extractedQuestions の該当エントリを更新
    extractedQuestions[idx].question      = newText;
    extractedQuestions[idx].review_needed = false;
    delete extractedQuestions[idx].review_info;

    // カードを通常表示に切り替え
    const card = document.getElementById(`qcard-${idx}`);
    card.classList.remove('review-needed');
    document.getElementById(`qtext-${idx}`).textContent = newText;
    // textarea・保存ボタン・review-info を非表示化
    card.querySelectorAll('.review-input, .review-save, .review-info, .review-badge').forEach(el => el.remove());

    // 残り要確認数を再カウントしてバッジ・ボタン更新
    const remaining = extractedQuestions.filter(q => q.review_needed).length;
    const reviewBadge = document.getElementById('review-count');
    const warnBox     = document.getElementById('review-warn-box');
    const commitBtn   = document.getElementById('btn-commit');
    if (remaining > 0) {
      reviewBadge.textContent = `⚠️ ${remaining}要確認`;
      warnBox.textContent =
        `⚠️ あと${remaining}問の確認が残っています。修正が完了するまで登録できません。`;
    } else {
      reviewBadge.style.display = 'none';
      warnBox.style.display = 'none';
      commitBtn.disabled = false;
    }
  }

  // GitHubにコミット
  async function commitQuestions() {
    if (extractedQuestions.length === 0) return;

    const secret = document.getElementById('upload-secret').value;
    const subcatFile = document.getElementById('subcat-file').value;
    const workerUrl = localStorage.getItem('worker_url');
    const statusEl = document.getElementById('commit-status');
    const btn = document.getElementById('btn-commit');

    btn.disabled = true;
    statusEl.innerHTML = '<div class="status-box loading">📡 GitHubにコミット中…</div>';

    try {
      const res = await fetch(`${workerUrl}/commit`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Upload-Secret': secret,
        },
        body: JSON.stringify({ questions: extractedQuestions, subcatFile })
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        const detail = data.detail ? '\n詳細: ' + data.detail : '';
        throw new Error((data.error || 'Commit failed') + detail);
      }

      statusEl.innerHTML = `
        <div class="status-box success">
          ✅ ${data.added}問を登録しました！<br>
          GitHub Pages に反映されるまで約5〜10分かかります。
        </div>`;

    } catch (err) {
      statusEl.innerHTML = `<div class="status-box error">❌ ${err.message}</div>`;
      btn.disabled = false;
    }
  }

  function setExtracting(loading) {
    document.getElementById('btn-extract').disabled = loading;
    document.getElementById('extract-label').style.display = loading ? 'none' : 'inline';
    document.getElementById('extract-spinner').style.display = loading ? 'inline-block' : 'none';
  }
</script>
</body>
</html>
